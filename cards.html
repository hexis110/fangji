<style>
/* Layout: one study column; home = today's queue + decks, review = one card that turns over like a paper slip */
:root{
  --paper:#f3f4ef;--sheet:#fbfcf8;--ink:#1f2a24;--muted:#5f6b63;--rule:#d9ddd3;
  --dai:#2f5d62;--dai-soft:#e3ecea;--zhu:#b5402f;--zhu-soft:#f6e3df;--ai:#3f7a4a;--ai-soft:#e2efe2;--amber:#93650f;--amber-soft:#f5ecd8;
  --serif:"Songti SC","STSong","Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#131815;--sheet:#1b221e;--ink:#e4e9e3;--muted:#9aa69e;--rule:#2f3a33;
  --dai:#7fb6b9;--dai-soft:#213334;--zhu:#ec8a77;--zhu-soft:#3a2420;--ai:#8cc694;--ai-soft:#1f3323;--amber:#e0b660;--amber-soft:#352c19;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131815;--sheet:#1b221e;--ink:#e4e9e3;--muted:#9aa69e;--rule:#2f3a33;
  --dai:#7fb6b9;--dai-soft:#213334;--zhu:#ec8a77;--zhu-soft:#3a2420;--ai:#8cc694;--ai-soft:#1f3323;--amber:#e0b660;--amber-soft:#352c19;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);font-size:16px;line-height:1.6;margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--dai);outline-offset:2px}
h1,h2{font-family:var(--serif);font-weight:700;text-wrap:balance;margin:0}
.label{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.toplink{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}
.toplink a{color:var(--dai);font-size:14px;text-decoration:none;border:1px solid var(--rule);border-radius:999px;padding:4px 12px;background:var(--sheet)}
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.masthead h1{font-size:30px;letter-spacing:.06em}
.masthead .sub{color:var(--muted);font-size:13px}
.seal{font-family:var(--serif);color:var(--zhu);border:2px solid var(--zhu);border-radius:4px;padding:2px 6px;font-size:13px;letter-spacing:.1em;transform:rotate(-4deg)}
.today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin-top:18px}
.today div{background:var(--sheet);padding:12px 14px}
.today b{display:block;font-family:var(--serif);font-size:26px;line-height:1.2}
.go{display:block;width:100%;margin-top:12px;border:1px solid var(--dai);background:var(--dai);color:var(--sheet);border-radius:6px;padding:14px;font-size:17px}
.go small{display:block;font-size:12px;opacity:.85}
.go:disabled{opacity:.5;cursor:default}
.sectionhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:28px;margin-bottom:10px}
.sectionhead h2{font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:14px;display:flex;gap:6px;align-items:baseline}
.chip small{color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{background:var(--dai-soft);border-color:var(--dai);color:var(--dai)}
.chip[aria-pressed="true"] small{color:var(--dai)}
.linkbtn{border:0;background:none;color:var(--dai);font-size:13px;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:16px}
.panel p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--rule)}
.setrow:first-child{border-top:0;padding-top:0}
.setrow .opts{display:flex;gap:6px;flex-wrap:wrap}
.mast{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--rule);margin:8px 0 6px}
.mast i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:11px 10px;text-align:center;line-height:1.3;flex:1 1 140px}
textarea{width:100%;min-height:80px;font:13px/1.4 ui-monospace,Menlo,monospace;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:8px;margin-top:10px;word-break:break-all}
.msg{font-size:14px;margin-top:8px;color:var(--dai)}
.search{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink)}
.flist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.fitem{background:var(--sheet);border:1px solid var(--rule);border-radius:5px;padding:10px 12px}
.fitem summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;list-style:none}
.fitem summary::-webkit-details-marker{display:none}
.fitem summary b{font-family:var(--serif);font-size:17px}
.fitem summary span{color:var(--muted);font-size:12px;white-space:nowrap}
.foot{margin-top:28px;font-size:12px;color:var(--muted);line-height:1.7}

/* review */
.rtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--rule)}
.back{border:0;background:none;padding:6px 8px 6px 0;color:var(--dai);font-size:15px}
.rtop .title{flex:1;min-width:0;font-family:var(--serif);font-weight:700}
.counts{font-size:13px;display:flex;gap:10px}
.counts .n{color:var(--dai)}.counts .l{color:var(--zhu)}.counts .r{color:var(--ai)}
.slip{margin-top:18px;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;min-height:min(52vh,440px);display:flex;flex-direction:column;position:relative;overflow:hidden}
.slip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--dai)}
.slip.k-zc::before{background:var(--ai)}.slip.k-rf::before{background:var(--zhu)}
.face{padding:22px 20px 20px 26px;display:flex;flex-direction:column;gap:14px;flex:1;min-width:0}
.kind{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.prompt{font-family:var(--serif);font-size:30px;line-height:1.35;overflow-wrap:anywhere}
.prompt.small{font-size:19px;line-height:1.7}
.ask{color:var(--muted);font-size:15px}
.answer{border-top:1px dashed var(--rule);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.field .label{display:block;margin-bottom:2px}
.field .v{font-size:17px;overflow-wrap:anywhere}
.field .v.big{font-family:var(--serif);font-size:20px;line-height:1.7}
.herbs{display:flex;flex-wrap:wrap;gap:6px}
.herbs span{background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:2px 8px;font-family:var(--serif);font-size:17px}
.herbs span.jun{border-color:var(--zhu);color:var(--zhu)}
.note{font-size:13px;color:var(--amber);background:var(--amber-soft);border-radius:4px;padding:6px 10px}
.flip{display:block;width:100%;margin-top:14px;border:1px solid var(--dai);background:var(--dai);color:var(--sheet);border-radius:6px;padding:15px;font-size:17px}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.grade{border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.grade b{font-size:16px}
.grade small{font-size:12px;color:var(--muted)}
.grade.g1{border-color:var(--zhu);color:var(--zhu)}
.grade.g3{border-color:var(--ai);color:var(--ai)}
.done{text-align:center;padding:36px 16px}
.done .big{font-family:var(--serif);font-size:44px;margin:8px 0}
@media (max-width:420px){.prompt{font-size:26px}}
@media (prefers-reduced-motion:no-preference){.answer{animation:rise .18s ease-out}@keyframes rise{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

var KINDS=[{k:'zc',name:'组成',ask:'写出组成药物'},{k:'gz',name:'功用·主治',ask:'说出功用与主治'},{k:'rf',name:'认方',ask:'这是哪首方？'}];
var KEY='fangji-cards-v1',SKEY='fangji-cards-settings-v1';
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var C=load(KEY,{}); // cardId -> {d:dueDay,i:interval,e:ease,r:reps,l:lapses}
var S=load(SKEY,{perDay:15,kinds:{zc:1,gz:1,rf:1},decks:null,newLog:{}});
if(!S.decks){S.decks={};for(var c=0;c<CH.length;c++)S.decks[c]=1}
if(!S.newLog)S.newLog={};
var app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function today(){var d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)}
function cid(fi,k){return fi+':'+k}
function allCards(){var a=[];for(var i=0;i<F.length;i++){if(!S.decks[F[i][0]])continue;KINDS.forEach(function(K){if(S.kinds[K.k])a.push({f:i,k:K.k,id:cid(i,K.k)})})}return a}
function newToday(){return S.newLog[today()]||0}
function queue(){
  var t=today(),due=[],fresh=[];
  allCards().forEach(function(c){var s=C[c.id];if(s){if(s.d<=t)due.push(c)}else fresh.push(c)});
  due.sort(function(a,b){return C[a.id].d-C[b.id].d});
  var room=Math.max(0,S.perDay-newToday());
  // new cards: interleave kinds so one formula's three cards are not back to back
  fresh.sort(function(a,b){return F[a.f][0]-F[b.f][0]||(a.f+kindOrder(a.k)*4)-(b.f+kindOrder(b.k)*4)||kindOrder(a.k)-kindOrder(b.k)});
  return{due:due,fresh:fresh.slice(0,room),freshTotal:fresh.length};
}
function kindOrder(k){return k==='zc'?0:k==='gz'?1:2}
function stats(){
  var m=0,l=0,u=0,t=0;
  allCards().forEach(function(c){t++;var s=C[c.id];if(!s)u++;else if(s.i>=21)m++;else l++});
  return{m:m,l:l,u:u,t:t};
}

// ---------- scheduling ----------
function preview(c,g){var s=C[c.id];return next(s,g).i}
function next(s,g){
  var n=s?{d:s.d,i:s.i,e:s.e,r:s.r,l:s.l}:{d:0,i:0,e:2.5,r:0,l:0};
  if(g===1){if(s&&s.r>0){n.l++;n.e=Math.max(1.3,n.e-0.2)}n.i=0;n.r=0}
  else if(!s||n.r===0){n.i=g===2?1:g===3?2:4;n.r=1;if(g===4)n.e+=0.15}
  else if(g===2){n.i=Math.max(n.i+1,Math.round(n.i*1.2));n.e=Math.max(1.3,n.e-0.15);n.r++}
  else if(g===3){n.i=Math.max(n.i+1,Math.round(n.i*n.e));n.r++}
  else{n.i=Math.max(n.i+2,Math.round(n.i*n.e*1.3));n.e+=0.15;n.r++}
  n.d=today()+n.i;return n;
}
function ivlText(i){if(i===0)return'稍后再现';if(i<30)return i+' 天';if(i<365)return Math.round(i/30)+' 个月';return(i/365).toFixed(1)+' 年'}

// ---------- home ----------
function home(msg){
  var q=queue(),st=stats();
  var h='<nav class="toplink" style="gap:8px;flex-wrap:wrap"><a href="games.html">方剂游戏 →</a><a href="index.html">做习题 →</a></nav>';
  h+='<header class="masthead"><div><div class="label">十四五版 · 代表方 '+F.length+' 首</div><h1>方剂记忆卡</h1><div class="sub">看方名想组成，看功用认方剂 · 按遗忘规律安排复习</div></div><span class="seal">日日新</span></header>';
  h+='<div class="today tnum"><div><span class="label">今日到期</span><b>'+q.due.length+'</b></div><div><span class="label">今日新卡</span><b style="color:var(--dai)">'+q.fresh.length+'</b></div><div><span class="label">已牢记</span><b style="color:var(--ai)">'+st.m+'</b></div></div>';
  var total=q.due.length+q.fresh.length;
  h+='<button class="go" id="b-go"'+(total?'':' disabled')+'>'+(total?'开始今天的复习<small>约 '+Math.max(1,Math.round(total*0.25))+' 分钟 · '+total+' 张</small>':'今天的卡片都复习完了<small>'+(q.freshTotal?'明天会有新卡；也可以在下方调高每日新卡数':'所选章节已全部学过')+'</small>')+'</button>';
  h+='<div class="sectionhead"><h2>学习进度</h2><span class="label tnum">共 '+st.t+' 张卡</span></div>';
  h+='<div class="panel"><div class="mast"><i style="width:'+(st.m/st.t*100)+'%;background:var(--ai)"></i><i style="width:'+(st.l/st.t*100)+'%;background:var(--dai)"></i></div><div class="legend tnum"><span style="--c:var(--ai)">已牢记 '+st.m+'（间隔 ≥ 21 天）</span><span style="--c:var(--dai)">学习中 '+st.l+'</span><span style="--c:var(--rule)">未学 '+st.u+'</span></div></div>';
  h+='<div class="sectionhead"><h2>选择章节</h2><span><button class="linkbtn" id="b-all">全选</button>　<button class="linkbtn" id="b-none">全不选</button></span></div><div class="chips">';
  for(var c=0;c<CH.length;c++){var n=0;for(var i=0;i<F.length;i++)if(F[i][0]===c)n++;h+='<button class="chip" data-ch="'+c+'" aria-pressed="'+(S.decks[c]?'true':'false')+'">'+esc(CH[c])+'<small class="tnum">'+n+'</small></button>'}
  h+='</div>';
  h+='<div class="sectionhead"><h2>设置</h2></div><div class="panel">';
  h+='<div class="setrow"><span>卡片类型</span><span class="opts">';
  KINDS.forEach(function(K){h+='<button class="chip kind" data-k="'+K.k+'" aria-pressed="'+(S.kinds[K.k]?'true':'false')+'">'+K.name+'</button>'});
  h+='</span></div><div class="setrow"><span>每日新卡</span><span class="opts">';
  [5,10,15,20,30,50].forEach(function(n){h+='<button class="chip per" data-n="'+n+'" aria-pressed="'+(S.perDay===n?'true':'false')+'">'+n+'</button>'});
  h+='</span></div></div>';
  h+='<div class="sectionhead"><h2>方剂速查</h2><span class="label">点开看全部内容</span></div>';
  h+='<input class="search" id="q" type="search" placeholder="搜方名、药名或功用，如：柴胡、补中益气" autocomplete="off"><div class="flist" id="flist"></div>';
  h+='<div class="sectionhead"><h2>换设备与备份</h2><span class="label">进度只存在本机</span></div>';
  h+='<div class="panel"><p>点“复制进度码”，用 WhatsApp 或微信发给自己，在另一台设备粘贴后点“导入”。两边记录会合并，保留复习次数多的那一份。</p><div class="row"><button class="btn" id="b-exp">复制进度码</button><button class="btn" id="b-imp">导入</button></div><textarea id="code" placeholder="在这里粘贴进度码"></textarea><div class="msg" id="msg">'+(msg||'')+'</div></div>';
  h+='<p class="foot">组成、功用、主治依十四五版《方剂学》及课堂讲义整理，198 首的功用已与讲义原文核对。君药一项空缺的，是十四五版教材未分君臣佐使或各版说法不一。组成中红框为君药。</p>';
  app.innerHTML=h;
  bindHome();renderList('');
}
function bindHome(){
  document.getElementById('b-go').onclick=startReview;
  Array.prototype.forEach.call(document.querySelectorAll('.chip[data-ch]'),function(b){b.onclick=function(){var c=b.getAttribute('data-ch');S.decks[c]=S.decks[c]?0:1;save(SKEY,S);home()}});
  document.getElementById('b-all').onclick=function(){for(var c=0;c<CH.length;c++)S.decks[c]=1;save(SKEY,S);home()};
  document.getElementById('b-none').onclick=function(){for(var c=0;c<CH.length;c++)S.decks[c]=0;save(SKEY,S);home()};
  Array.prototype.forEach.call(document.querySelectorAll('.chip.kind'),function(b){b.onclick=function(){var k=b.getAttribute('data-k');S.kinds[k]=S.kinds[k]?0:1;if(!S.kinds.zc&&!S.kinds.gz&&!S.kinds.rf)S.kinds[k]=1;save(SKEY,S);home()}});
  Array.prototype.forEach.call(document.querySelectorAll('.chip.per'),function(b){b.onclick=function(){S.perDay=+b.getAttribute('data-n');save(SKEY,S);home()}});
  var qi=document.getElementById('q');qi.oninput=function(){renderList(qi.value.trim())};
  var code=document.getElementById('code'),msg=document.getElementById('msg');
  document.getElementById('b-exp').onclick=function(){
    var s='FC1:'+btoa(unescape(encodeURIComponent(JSON.stringify({v:1,c:C}))));code.value=s;
    var fb=function(){code.select();msg.textContent='请长按上面的文字，全选后复制。'};
    try{navigator.clipboard.writeText(s).then(function(){msg.textContent='进度码已复制（'+Object.keys(C).length+' 张卡的记录）。'},fb)}catch(e){fb()}
  };
  document.getElementById('b-imp').onclick=function(){
    try{var t=code.value.trim(),m=t.indexOf('FC1:');if(m<0)throw 0;
      var o=JSON.parse(decodeURIComponent(escape(atob(t.slice(m+4).replace(/\s+/g,''))))),n=0;
      for(var id in o.c){var a=o.c[id],b=C[id];if(!b||(a.r+a.l)>(b.r+b.l)||((a.r+a.l)===(b.r+b.l)&&a.d>b.d)){C[id]=a;n++}}
      save(KEY,C);home('已导入，更新了 '+n+' 张卡的记录。');
    }catch(e){msg.textContent='无法识别这段进度码。请确认复制完整（以 FC1: 开头）。'}
  };
}
function herbsHtml(f){
  var jun=f[6]?f[6].split('、'):[];
  var parts=f[3].split(/（/);var main=parts[0],extra=parts.length>1?'（'+parts.slice(1).join('（'):'';
  var h='<div class="herbs">';
  main.split('、').forEach(function(x){x=x.trim();if(!x)return;var isJ=jun.some(function(j){var jj=j.replace(/（.*?）/g,'');return x===jj||x.indexOf(jj)>=0||jj.indexOf(x)>=0});h+='<span'+(isJ?' class="jun"':'')+'>'+esc(x)+'</span>'});
  h+='</div>';if(extra)h+='<div class="label" style="margin-top:4px;letter-spacing:0">'+esc(extra)+'</div>';
  return h;
}
function srcText(x){var i=x.indexOf('（');return esc(i<0?'《'+x+'》':'《'+x.slice(0,i)+'》'+x.slice(i))}
function fullHtml(f,opts){
  opts=opts||{};
  var h='';
  if(!opts.noName)h+='<div class="field"><span class="label">方名 · 出处</span><div class="v big">'+esc(f[1])+'　<span style="font-size:15px;color:var(--muted)">'+srcText(f[2])+'</span></div></div>';
  h+='<div class="field"><span class="label">组成'+(f[6]?'（红框为君药）':'')+'</span>'+herbsHtml(f)+'</div>';
  h+='<div class="field"><span class="label">功用</span><div class="v big">'+esc(f[4])+'</div></div>';
  h+='<div class="field"><span class="label">主治</span><div class="v">'+esc(f[5])+'</div></div>';
  h+='<div class="field"><span class="label">君药</span><div class="v">'+(f[6]?esc(f[6]):'<span style="color:var(--muted)">十四五版未分或说法不一</span>')+'</div></div>';
  return h;
}
function renderList(q){
  var el=document.getElementById('flist');if(!el)return;
  var h='',n=0;
  for(var i=0;i<F.length;i++){var f=F[i];
    if(q&&(f[1]+f[3]+f[4]+f[5]+f[2]).indexOf(q)<0)continue;
    n++;
    if(n>40&&!q)break;
    h+='<details class="fitem"><summary><b>'+esc(f[1])+'</b><span>'+esc(CH[f[0]])+'</span></summary><div class="answer" style="border:0;padding-top:10px">'+fullHtml(f,{noName:true})+'</div></details>';
  }
  if(!q&&F.length>40)h+='<p class="label" style="letter-spacing:0">显示前 40 首，输入关键字可搜索全部 '+F.length+' 首。</p>';
  if(q&&!n)h='<p class="label" style="letter-spacing:0">没有找到“'+esc(q)+'”。</p>';
  el.innerHTML=h;
}

// ---------- review ----------
var R=null;
function startReview(){
  var q=queue();
  var newC=q.fresh;
  // mix: one new card after every two reviews
  var list=[],di=0,ni=0;
  while(di<q.due.length||ni<newC.length){
    if(di<q.due.length)list.push(q.due[di++]);
    if(di<q.due.length)list.push(q.due[di++]);
    if(ni<newC.length)list.push(newC[ni++]);
  }
  R={list:list,pos:0,shown:false,done:0,again:0,newIds:{}};
  newC.forEach(function(c){R.newIds[c.id]=1});
  show();
}
function show(){
  window.scrollTo(0,0);
  if(R.pos>=R.list.length)return finish();
  var c=R.list[R.pos],f=F[c.f],K=KINDS.filter(function(x){return x.k===c.k})[0],s=C[c.id];
  var left=R.list.length-R.pos,nNew=0,nLearn=0,nRev=0;
  for(var p=R.pos;p<R.list.length;p++){var cc=R.list[p],ss=C[cc.id];if(!ss)nNew++;else if(ss.r===0)nLearn++;else nRev++}
  var h='<div class="rtop"><button class="back" id="b-home">‹ 返回</button><span class="title">今日复习</span><span class="counts tnum"><span class="n">新 '+nNew+'</span><span class="l">重学 '+nLearn+'</span><span class="r">复习 '+nRev+'</span></span></div>';
  h+='<article class="slip k-'+c.k+'"><div class="face"><div class="kind"><span>'+K.name+' · '+esc(CH[f[0]])+'</span><span>'+(s?(s.r===0?'重学':'第 '+(s.r+1)+' 次复习'):'新卡')+'</span></div>';
  if(c.k==='rf'){
    h+='<div class="field"><span class="label">功用</span><div class="prompt small">'+esc(f[4])+'</div></div><div class="field"><span class="label">主治</span><div class="v">'+esc(f[5])+'</div></div><div class="ask">'+K.ask+'</div>';
  }else{
    h+='<div class="prompt">'+esc(f[1])+'</div><div class="ask">'+K.ask+'</div>';
  }
  if(R.shown){
    h+='<div class="answer">';
    if(c.k==='zc'){h+='<div class="field"><span class="label">组成'+(f[6]?'（红框为君药）':'')+'</span>'+herbsHtml(f)+'</div><div class="field"><span class="label">功用</span><div class="v">'+esc(f[4])+'</div></div>'}
    else if(c.k==='gz'){h+='<div class="field"><span class="label">功用</span><div class="v big">'+esc(f[4])+'</div></div><div class="field"><span class="label">主治</span><div class="v">'+esc(f[5])+'</div></div>'}
    else{h+='<div class="field"><span class="label">方名 · 出处</span><div class="v big">'+esc(f[1])+'　<span style="font-size:15px;color:var(--muted)">'+srcText(f[2])+'</span></div></div><div class="field"><span class="label">组成</span>'+herbsHtml(f)+'</div>'}
    h+='</div>';
  }
  h+='</div></article>';
  if(!R.shown)h+='<button class="flip" id="b-flip">看答案</button>';
  else{
    var labels=[['忘了','g1'],['模糊','g2'],['记得','g3'],['很熟','g4']];
    h+='<div class="grades">';
    for(var g=1;g<=4;g++)h+='<button class="grade '+labels[g-1][1]+'" data-g="'+g+'"><b>'+labels[g-1][0]+'</b><small class="tnum">'+ivlText(preview(c,g))+'</small></button>';
    h+='</div><p class="label" style="letter-spacing:0;margin-top:10px">先在心里（或纸上）答一遍，再按实际情况评分。“忘了”的卡会在本轮稍后再出现。</p>';
  }
  app.innerHTML=h;
  document.getElementById('b-home').onclick=function(){R=null;home()};
  var fb=document.getElementById('b-flip');if(fb)fb.onclick=function(){R.shown=true;show()};
  Array.prototype.forEach.call(document.querySelectorAll('.grade'),function(b){b.onclick=function(){grade(+b.getAttribute('data-g'))}});
}
function grade(g){
  var c=R.list[R.pos],wasNew=!C[c.id];
  C[c.id]=next(C[c.id],g);save(KEY,C);
  if(wasNew){var t=today(),nn=newToday()+1;S.newLog={};S.newLog[t]=nn;save(SKEY,S)}
  R.done++;
  if(g===1){R.again++;var at=Math.min(R.list.length,R.pos+4);R.list.splice(at,0,c)}
  R.pos++;R.shown=false;show();
}
function finish(){
  var h='<div class="rtop"><button class="back" id="b-home">‹ 返回</button><span class="title">今日复习</span></div>';
  h+='<div class="slip"><div class="done"><div class="label">今天完成</div><div class="big tnum">'+R.done+' 次</div><p style="color:var(--muted)">其中“忘了” '+R.again+' 次，这些卡明天会再出现。</p><button class="flip" id="b-back">回到首页</button></div></div>';
  app.innerHTML=h;
  document.getElementById('b-home').onclick=document.getElementById('b-back').onclick=function(){R=null;home()};
}
document.addEventListener('keydown',function(e){
  if(!R||R.pos>=R.list.length)return;
  if(!R.shown&&(e.key===' '||e.key==='Enter')){e.preventDefault();R.shown=true;show()}
  else if(R.shown&&/^[1-4]$/.test(e.key))grade(+e.key);
});
home();
try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&!/claude|anthropic/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(function(){})}}catch(e){}
})();
</script>
