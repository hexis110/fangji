<title>方剂游戏</title>

<style>
/* Layout: one study column; home = three game tiles; each game is one task per screen with a bottom action bar */
:root{
  --paper:#f3f4ef;--sheet:#fbfcf8;--ink:#1f2a24;--muted:#5f6b63;--rule:#d9ddd3;
  --dai:#2f5d62;--dai-soft:#e3ecea;--zhu:#b5402f;--zhu-soft:#f6e3df;--ai:#3f7a4a;--ai-soft:#e2efe2;--amber:#93650f;--amber-soft:#f5ecd8;
  --jun:#b5402f;--chen:#2f5d62;--zuo:#6b5a2e;--shi:#5b5f8a;
  --serif:"Songti SC","STSong","Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#131815;--sheet:#1b221e;--ink:#e4e9e3;--muted:#9aa69e;--rule:#2f3a33;
  --dai:#7fb6b9;--dai-soft:#213334;--zhu:#ec8a77;--zhu-soft:#3a2420;--ai:#8cc694;--ai-soft:#1f3323;--amber:#e0b660;--amber-soft:#352c19;
  --jun:#ec8a77;--chen:#7fb6b9;--zuo:#d2b871;--shi:#a9add8;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131815;--sheet:#1b221e;--ink:#e4e9e3;--muted:#9aa69e;--rule:#2f3a33;
  --dai:#7fb6b9;--dai-soft:#213334;--zhu:#ec8a77;--zhu-soft:#3a2420;--ai:#8cc694;--ai-soft:#1f3323;--amber:#e0b660;--amber-soft:#352c19;
  --jun:#ec8a77;--chen:#7fb6b9;--zuo:#d2b871;--shi:#a9add8;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);font-size:16px;line-height:1.6;margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--dai);outline-offset:2px}
h1,h2{font-family:var(--serif);font-weight:700;text-wrap:balance;margin:0}
.label{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.nav{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.nav a{color:var(--dai);font-size:14px;text-decoration:none;border:1px solid var(--rule);border-radius:999px;padding:4px 12px;background:var(--sheet)}
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.masthead h1{font-size:30px;letter-spacing:.06em}
.masthead .sub{color:var(--muted);font-size:13px}
.seal{font-family:var(--serif);color:var(--zhu);border:2px solid var(--zhu);border-radius:4px;padding:2px 6px;font-size:13px;letter-spacing:.1em;transform:rotate(-4deg)}
.tiles{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.tile{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px}
.tile .glyph{width:64px;height:64px;border-radius:6px;display:grid;place-items:center;font-family:var(--serif);font-size:30px;color:var(--sheet);background:var(--dai)}
.tile:nth-child(1) .glyph{background:var(--jun)}.tile:nth-child(3) .glyph{background:var(--ai)}
.tile b{font-family:var(--serif);font-size:20px;display:block}
.tile p{margin:2px 0 6px;color:var(--muted);font-size:14px}
.tile .meta{font-size:12px;color:var(--muted)}
.filter{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.filter select{font:inherit;padding:8px 10px;border-radius:6px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);max-width:100%}
.foot{margin-top:28px;font-size:12px;color:var(--muted);line-height:1.7}

.gtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--rule)}
.back{border:0;background:none;padding:6px 8px 6px 0;color:var(--dai);font-size:15px}
.gtop .title{flex:1;min-width:0;font-family:var(--serif);font-weight:700}
.gtop .count{font-size:13px;color:var(--muted)}
.progress{height:3px;background:var(--rule);margin-top:-1px}.progress i{display:block;height:100%;background:var(--dai)}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:16px;margin-top:14px}
.fname{font-family:var(--serif);font-size:28px;line-height:1.3}
.fmeta{color:var(--muted);font-size:14px;margin-top:2px}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:12px 10px;text-align:center;line-height:1.3;flex:1 1 120px}
.btn.primary{background:var(--dai);border-color:var(--dai);color:var(--sheet)}
.btn:disabled{opacity:.45;cursor:default}
.bar{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* 组方 */
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:12px;border:1px dashed var(--rule);border-radius:6px;margin-top:14px;background:var(--paper)}
.tray.empty::after{content:"药材已全部放好";color:var(--muted);font-size:13px;align-self:center}
.herb{touch-action:none;user-select:none;-webkit-user-select:none;border:1px solid var(--rule);background:var(--sheet);border-radius:4px;padding:6px 12px;font-family:var(--serif);font-size:18px;line-height:1.3;display:inline-flex;flex-direction:column;align-items:center}
.herb.sel{outline:3px solid var(--dai);outline-offset:1px}
.herb small{font-family:var(--sans);font-size:11px;color:var(--zhu)}
.herb.ok{border-color:var(--ai);background:var(--ai-soft)}
.herb.no{border-color:var(--zhu);background:var(--zhu-soft)}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-60%) scale(1.08);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
@media (max-width:460px){.slots{grid-template-columns:1fr}}
.slot{border:1px solid var(--rule);border-radius:6px;background:var(--sheet);min-height:92px;padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px;text-align:left}
.slot.hot{outline:2px dashed var(--dai);outline-offset:-2px;background:var(--dai-soft)}
.slot .sh{display:flex;align-items:baseline;gap:8px}
.slot .sh b{font-family:var(--serif);font-size:22px;color:var(--c)}
.slot .sh span{font-size:12px;color:var(--muted)}
.slot .in{display:flex;flex-wrap:wrap;gap:6px}
.score{font-family:var(--serif);font-size:20px}

/* 鉴别 */
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;margin-top:14px}
.vs .side{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px;text-align:center;min-width:0}
.vs .side b{font-family:var(--serif);font-size:20px;display:block;overflow-wrap:anywhere}
.vs .side span{font-size:12px;color:var(--muted)}
.vs .x{font-family:var(--serif);color:var(--muted)}
.vs .A{border-top:4px solid var(--dai)}.vs .B{border-top:4px solid var(--zuo)}
.stmts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.stmt{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px}
.stmt p{margin:0 0 10px;font-size:16px;overflow-wrap:anywhere}
.stmt .ch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stmt .ch button{border:1px solid var(--rule);background:var(--paper);border-radius:5px;padding:8px 4px;font-size:14px;overflow-wrap:anywhere}
.stmt .ch button.ok{background:var(--ai-soft);border-color:var(--ai);color:var(--ai)}
.stmt .ch button.no{background:var(--zhu-soft);border-color:var(--zhu);color:var(--zhu)}
.stmt.done{opacity:.92}
.same{margin-top:14px;padding:12px 14px;border-left:3px solid var(--dai);background:var(--dai-soft);border-radius:0 4px 4px 0;font-size:15px}
.cmp{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px;table-layout:fixed}
.cmp th,.cmp td{border-top:1px solid var(--rule);padding:8px 6px;vertical-align:top;text-align:left;overflow-wrap:anywhere}
.cmp th{width:3.5em;color:var(--muted);font-weight:400;font-size:12px}
.cmp td em{font-style:normal;color:var(--zhu);font-weight:600}

/* 辨证 */
.case{font-family:var(--serif);font-size:20px;line-height:1.75;margin-top:6px}
.case-label{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.choice{text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:5px;padding:12px 14px;font-family:var(--serif);font-size:19px}
.choice small{display:block;font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:2px}
.choice.ok{background:var(--ai-soft);border-color:var(--ai)}
.choice.no{background:var(--zhu-soft);border-color:var(--zhu)}
.choice:disabled{cursor:default;color:var(--ink)}
.explain{margin-top:14px;padding:12px 14px;border-left:3px solid var(--ai);background:var(--ai-soft);border-radius:0 4px 4px 0;font-size:15px}
.explain.bad{border-left-color:var(--zhu);background:var(--zhu-soft)}
.result{text-align:center;padding:26px 16px}
.result .big{font-family:var(--serif);font-size:52px;line-height:1;margin:10px 0}
.missed{text-align:left;margin-top:16px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.missed div{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:8px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function inCh(name){return !P.ch||F[name][0]===P.ch}
var ROLE={'君':{c:'var(--jun)',d:'针对主病主证'},'臣':{c:'var(--chen)',d:'辅助君药或治兼证'},'佐':{c:'var(--zuo)',d:'佐助、佐制、反佐'},'使':{c:'var(--shi)',d:'引经、调和诸药'}};
function roleOk(want,got){return want===got||(want==='佐使'&&(got==='佐'||got==='使'))}

// ---------- home ----------
function home(){
  var j=0,pr=0,cs=0,cr=0;
  for(var k in P.jcz)if(P.jcz[k]===1)j++;
  for(k in P.pairs)if(P.pairs[k]===1)pr++;
  for(k in P.cases){cs++;if(P.cases[k][1]===0||P.cases[k][0]>P.cases[k][1])cr++}
  var h='<nav class="nav"><a href="index.html">做习题</a><a href="cards.html">记忆卡</a></nav>';
  h+='<header class="masthead"><div><div class="label">方剂学 · 练组方思路</div><h1>方剂游戏</h1><div class="sub">排君臣佐使 · 辨相似方 · 据证选方</div></div><span class="seal">学而时习</span></header>';
  h+='<div class="filter"><label for="chsel">章节</label><select id="chsel"><option value="">全部章节</option>';
  CH.forEach(function(c){h+='<option'+(P.ch===c?' selected':'')+'>'+esc(c)+'</option>'});
  h+='</select><span>（适用于组方和辨证）</span></div>';
  var nj=D.jcz.filter(function(x){return inCh(x[0])}).length, nc=D.cases.filter(function(x){return inCh(x[0])}).length;
  h+='<div class="tiles">';
  h+='<button class="tile" id="t-jcz"><span class="glyph">君</span><span><b>组方 · 排君臣佐使</b><p>把药材拖到君、臣、佐、使的位置，练组方逻辑。</p><span class="meta tnum">'+nj+' 首可练 · 已全对 '+j+' 首</span></span></button>';
  h+='<button class="tile" id="t-pair"><span class="glyph">辨</span><span><b>鉴别 · 两方异同</b><p>两首相似方并排，判断每条特点属于哪一方。</p><span class="meta tnum">'+D.pairs.length+' 组 · 已全对 '+pr+' 组（不按章节筛选）</span></span></button>';
  h+='<button class="tile" id="t-case"><span class="glyph">证</span><span><b>辨证 · 据证选方</b><p>读辨证要点，从四首方中选出对证的一首。</p><span class="meta tnum">'+nc+' 例可练 · 已练 '+cs+' 方</span></span></button>';
  h+='</div>';
  h+='<p class="foot">君臣佐使取自讲义与通行教材，只收录十四五版明确分君臣佐使的方剂；带“佐使”的药放在佐或使都算对。鉴别要点整理自讲义【鉴别】部分，辨证要点取自讲义各方“临床应用”。</p>';
  app.innerHTML=h;
  document.getElementById('chsel').onchange=function(e){P.ch=e.target.value;save();home()};
  document.getElementById('t-jcz').onclick=function(){startJcz()};
  document.getElementById('t-pair').onclick=function(){startPair()};
  document.getElementById('t-case').onclick=function(){startCase()};
}
function top(title,pos,total){
  return '<div class="gtop"><button class="back" id="b-home">‹ 游戏</button><span class="title">'+title+'</span>'+(total?'<span class="count tnum">'+pos+' / '+total+'</span>':'')+'</div>'+(total?'<div class="progress"><i style="width:'+((pos-1)/total*100)+'%"></i></div>':'');
}
function bindTop(){document.getElementById('b-home').onclick=function(){G=null;home()}}
var G=null;
function finish(title,score,total,missed,again){
  var h=top(title)+'<div class="card result"><div class="label">本轮成绩</div><div class="big tnum">'+score+' / '+total+'</div>';
  if(missed.length){h+='<div class="missed"><div class="label" style="border:0;background:none;padding:0">需要再看看</div>';missed.forEach(function(m){h+='<div>'+m+'</div>'});h+='</div>'}
  h+='<div class="bar"><button class="btn" id="b-h2">回到游戏</button><button class="btn primary" id="b-again">再来一轮</button></div></div>';
  app.innerHTML=h;bindTop();
  document.getElementById('b-h2').onclick=function(){G=null;home()};
  document.getElementById('b-again').onclick=again;
}

// ---------- 组方 ----------
function startJcz(){
  var pool=D.jcz.filter(function(x){return inCh(x[0])});
  // unsolved first
  pool=shuffle(pool).sort(function(a,b){return (P.jcz[a[0]]===1)-(P.jcz[b[0]]===1)});
  G={kind:'jcz',list:pool.slice(0,8),pos:0,score:0,missed:[]};
  if(!G.list.length){home();return}
  newJcz();
}
function newJcz(){
  var it=G.list[G.pos];
  G.cur={name:it[0],herbs:shuffle(it[1]).map(function(h,i){return{id:i,name:h[0],role:h[1],at:null}}),sel:null,checked:false};
  drawJcz();
}
function drawJcz(){
  var c=G.cur,f=F[c.name];
  var h=top('组方',G.pos+1,G.list.length);
  h+='<div class="card"><div class="fname">'+esc(c.name)+'</div><div class="fmeta">'+esc(f[0])+' · 功用：'+esc(f[1])+'</div>';
  h+='<div class="hint">拖动药材到下方位置；也可以先点药材，再点位置。点已放好的药材可以挪动或放回。</div></div>';
  var left=c.herbs.filter(function(x){return x.at===null});
  h+='<div class="tray'+(left.length?'':' empty')+'" data-slot="tray">';
  left.forEach(function(x){h+=herbHtml(x)});
  h+='</div><div class="slots">';
  ['君','臣','佐','使'].forEach(function(r){
    h+='<div class="slot" data-slot="'+r+'" style="--c:'+ROLE[r].c+'"><div class="sh"><b>'+r+'</b><span>'+ROLE[r].d+'</span></div><div class="in">';
    c.herbs.filter(function(x){return x.at===r}).forEach(function(x){h+=herbHtml(x)});
    h+='</div></div>';
  });
  h+='</div>';
  if(c.checked){
    var ok=c.herbs.filter(function(x){return roleOk(x.role,x.at)}).length;
    h+='<div class="card"><span class="score tnum">'+ok+' / '+c.herbs.length+' 味放对</span>'+(ok===c.herbs.length?'　<span style="color:var(--ai)">全对！</span>':'<div class="hint">红色的药材下方标出了正确位置。</div>')+'</div>';
    h+='<div class="bar"><button class="btn primary" id="b-next">'+(G.pos+1<G.list.length?'下一首':'看成绩')+'</button></div>';
  }else{
    h+='<div class="bar"><button class="btn" id="b-reset">全部放回</button><button class="btn primary" id="b-check"'+(left.length?' disabled':'')+'>核对</button></div>';
  }
  app.innerHTML=h;bindTop();
  if(c.checked){document.getElementById('b-next').onclick=function(){G.pos++;if(G.pos>=G.list.length)return finish('组方',G.score,G.list.length,G.missed,startJcz);newJcz()};return}
  document.getElementById('b-reset').onclick=function(){c.herbs.forEach(function(x){x.at=null});c.sel=null;drawJcz()};
  document.getElementById('b-check').onclick=function(){
    c.checked=true;var all=c.herbs.every(function(x){return roleOk(x.role,x.at)});
    if(all){G.score++;P.jcz[c.name]=1}else{if(P.jcz[c.name]!==1)P.jcz[c.name]=0;G.missed.push(esc(c.name)+'：'+['君','臣','佐','使'].map(function(r){var a=c.herbs.filter(function(x){return x.role===r||(r==='佐'&&x.role==='佐使')}).map(function(x){return x.name+(x.role==='佐使'?'(佐使)':'')});return a.length?r+' '+a.join('、'):''}).filter(Boolean).join('；'))}
    save();drawJcz();
  };
  bindDrag();
}
function herbHtml(x){
  var c=G.cur,cls='herb';
  if(c.sel===x.id)cls+=' sel';
  var tip='';
  if(c.checked){if(roleOk(x.role,x.at))cls+=' ok';else{cls+=' no';tip='<small>应为'+x.role+'</small>'}}
  else if(x.role==='佐使'&&false){}
  return '<button class="'+cls+'" data-h="'+x.id+'"'+(c.checked?' disabled':'')+'>'+esc(x.name)+tip+'</button>';
}
function place(id,slot){var x=G.cur.herbs[id];x.at=slot==='tray'?null:slot;G.cur.sel=null;drawJcz()}
function bindDrag(){
  var c=G.cur;
  Array.prototype.forEach.call(document.querySelectorAll('[data-slot]'),function(s){
    s.addEventListener('click',function(e){if(e.target.closest('.herb'))return;if(c.sel!==null)place(c.sel,s.getAttribute('data-slot'))});
  });
  Array.prototype.forEach.call(document.querySelectorAll('.herb'),function(el){
    el.addEventListener('pointerdown',function(e){
      if(c.checked)return;
      var id=+el.getAttribute('data-h'),sx=e.clientX,sy=e.clientY,ghost=null,hot=null;
      try{el.setPointerCapture(e.pointerId)}catch(_){}
      function move(ev){
        if(!ghost&&Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>8){ghost=el.cloneNode(true);ghost.classList.add('ghost');document.body.appendChild(ghost);el.style.opacity='.35'}
        if(ghost){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';
          var t=document.elementFromPoint(ev.clientX,ev.clientY),s=t&&t.closest('[data-slot]');
          if(hot&&hot!==s)hot.classList.remove('hot');if(s){s.classList.add('hot');hot=s}}
      }
      function up(ev){
        el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);
        if(ghost){ghost.remove();el.style.opacity='';if(hot)hot.classList.remove('hot');
          var t=document.elementFromPoint(ev.clientX,ev.clientY),s=t&&t.closest('[data-slot]');
          if(s)place(id,s.getAttribute('data-slot'));}
        else{ // tap
          if(c.sel===id){c.sel=null;drawJcz()}
          else if(c.sel!==null&&c.herbs[id].at!==null&&c.herbs[c.sel].at===null){place(c.sel,c.herbs[id].at)}
          else{c.sel=id;drawJcz()}
        }
      }
      el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
      e.preventDefault();
    });
  });
}

// ---------- 鉴别 ----------
function herbList(n){return F[n][3].replace(/（.*?）/g,'').split('、')}
function norm(h){return h.replace(/^(炙|生|制|煨|炮|全|酒|鲜|川|怀)/,'').replace(/(梢|节|身)$/,'').replace(/^(橘皮|橘红)$/,'陈皮').replace(/^白芍$/,'芍药').replace(/^干地黄$|^熟地黄$/,'地黄')}
function startPair(){
  var pool=shuffle(D.pairs).sort(function(a,b){return (P.pairs[a[0]+a[1]]===1)-(P.pairs[b[0]+b[1]]===1)});
  G={kind:'pair',list:pool.slice(0,5),pos:0,score:0,missed:[]};newPair();
}
function newPair(){
  var p=G.list[G.pos],A=p[0],B=p[1],items=[];
  p[3].forEach(function(t){items.push({t:t,a:'A'})});
  p[4].forEach(function(t){items.push({t:t,a:'B'})});
  var ha=herbList(A),hb=herbList(B),na=ha.map(norm),nb=hb.map(norm);
  var onlyA=ha.filter(function(h,i){return nb.indexOf(na[i])<0}),onlyB=hb.filter(function(h,i){return na.indexOf(nb[i])<0}),both=ha.filter(function(h,i){return nb.indexOf(na[i])>=0});
  shuffle(onlyA).slice(0,2).forEach(function(h){items.push({t:'组成中有'+h,a:'A'})});
  shuffle(onlyB).slice(0,2).forEach(function(h){items.push({t:'组成中有'+h,a:'B'})});
  shuffle(both).slice(0,2).forEach(function(h){items.push({t:'组成中有'+h,a:'共'})});
  G.cur={p:p,items:shuffle(items),ans:{},onlyA:onlyA,onlyB:onlyB};
  drawPair();
}
function drawPair(){
  var c=G.cur,p=c.p,A=p[0],B=p[1],done=Object.keys(c.ans).length===c.items.length;
  var h=top('鉴别',G.pos+1,G.list.length);
  h+='<div class="vs"><div class="side A"><b>'+esc(A)+'</b><span>'+esc(F[A][0])+'</span></div><span class="x">与</span><div class="side B"><b>'+esc(B)+'</b><span>'+esc(F[B][0])+'</span></div></div>';
  h+='<p class="hint">每条特点属于哪一方？两方都有的选“共有”。</p><div class="stmts">';
  c.items.forEach(function(it,i){
    var a=c.ans[i];
    h+='<div class="stmt'+(a?' done':'')+'"><p>'+esc(it.t)+'</p><div class="ch">';
    [['A',A],['共','共有'],['B',B]].forEach(function(o){
      var cls='';if(a){if(o[0]===it.a)cls='ok';else if(o[0]===a)cls='no'}
      h+='<button class="'+cls+'" data-i="'+i+'" data-v="'+o[0]+'"'+(a?' disabled':'')+'>'+esc(o[1])+'</button>';
    });
    h+='</div></div>';
  });
  h+='</div>';
  if(done){
    var ok=c.items.filter(function(it,i){return c.ans[i]===it.a}).length;
    h+='<div class="card"><span class="score tnum">'+ok+' / '+c.items.length+' 条判断正确</span>';
    h+='<div class="same"><b>相同点：</b>'+esc(p[2])+'</div>';
    h+='<table class="cmp"><tr><th></th><td><b>'+esc(A)+'</b></td><td><b>'+esc(B)+'</b></td></tr>';
    h+='<tr><th>要点</th><td>'+p[3].map(esc).join('<br>')+'</td><td>'+p[4].map(esc).join('<br>')+'</td></tr>';
    h+='<tr><th>功用</th><td>'+esc(F[A][1])+'</td><td>'+esc(F[B][1])+'</td></tr>';
    h+='<tr><th>组成</th><td>'+mark(A,c.onlyA)+'</td><td>'+mark(B,c.onlyB)+'</td></tr></table>';
    h+='<div class="hint">组成中红字为该方独有的药。</div></div>';
    h+='<div class="bar"><button class="btn primary" id="b-next">'+(G.pos+1<G.list.length?'下一组':'看成绩')+'</button></div>';
  }
  app.innerHTML=h;bindTop();
  Array.prototype.forEach.call(document.querySelectorAll('.stmt button'),function(b){b.onclick=function(){c.ans[+b.getAttribute('data-i')]=b.getAttribute('data-v');drawPair()}});
  if(done){
    var key=p[0]+p[1],all=c.items.every(function(it,i){return c.ans[i]===it.a});
    if(c.scored!==true){c.scored=true;if(all){G.score++;P.pairs[key]=1}else{if(P.pairs[key]!==1)P.pairs[key]=0;G.missed.push(esc(p[0])+' 与 '+esc(p[1]))}save()}
    document.getElementById('b-next').onclick=function(){G.pos++;if(G.pos>=G.list.length)return finish('鉴别',G.score,G.list.length,G.missed,startPair);newPair()};
  }
}
function mark(n,only){return herbList(n).map(function(h){return only.indexOf(h)>=0?'<em>'+esc(h)+'</em>':esc(h)}).join('、')}

// ---------- 辨证 ----------
function startCase(){
  var pool=D.cases.filter(function(x){return inCh(x[0])});
  pool=shuffle(pool).sort(function(a,b){function w(n){var r=P.cases[n];return r?(r[1]-r[0]):1}return w(b[0])-w(a[0])});
  G={kind:'case',list:pool.slice(0,10),pos:0,score:0,missed:[]};
  if(!G.list.length){home();return}
  newCase();
}
function newCase(){
  var it=G.list[G.pos],n=it[0],ch=F[n][0];
  var same=shuffle(Object.keys(F).filter(function(k){return k!==n&&F[k][0]===ch&&D.caseNames[k]}));
  var other=shuffle(Object.keys(F).filter(function(k){return k!==n&&F[k][0]!==ch&&D.caseNames[k]}));
  var opts=same.slice(0,3);while(opts.length<3)opts.push(other.shift());
  G.cur={n:n,text:it[1],opts:shuffle(opts.concat([n])),pick:null};
  drawCase();
}
function drawCase(){
  var c=G.cur;
  var h=top('辨证',G.pos+1,G.list.length);
  h+='<div class="card"><div class="case-label">患者症见</div><div class="case">'+esc(c.text)+'</div><div class="hint">宜选用哪首方剂？</div></div><div class="choices">';
  c.opts.forEach(function(o){
    var cls='';if(c.pick){if(o===c.n)cls=' ok';else if(o===c.pick)cls=' no'}
    h+='<button class="choice'+cls+'" data-o="'+esc(o)+'"'+(c.pick?' disabled':'')+'>'+esc(o)+(c.pick?'<small>'+esc(F[o][1])+'</small>':'')+'</button>';
  });
  h+='</div>';
  if(c.pick){
    var ok=c.pick===c.n;
    h+='<div class="explain'+(ok?'':' bad')+'"><b>'+(ok?'选对了。':'应选 '+esc(c.n)+'。')+'</b> '+esc(c.n)+'：'+esc(F[c.n][1])+'；主治'+esc(F[c.n][2])+'。</div>';
    h+='<div class="bar"><button class="btn primary" id="b-next">'+(G.pos+1<G.list.length?'下一例':'看成绩')+'</button></div>';
  }
  app.innerHTML=h;bindTop();
  Array.prototype.forEach.call(document.querySelectorAll('.choice'),function(b){b.onclick=function(){
    c.pick=b.getAttribute('data-o');var r=P.cases[c.n]||[0,0];
    if(c.pick===c.n){G.score++;r[0]++}else{r[1]++;G.missed.push(esc(c.n)+'：'+esc(c.text))}
    P.cases[c.n]=r;save();drawCase();
  }});
  var nx=document.getElementById('b-next');
  if(nx)nx.onclick=function(){G.pos++;if(G.pos>=G.list.length)return finish('辨证',G.score,G.list.length,G.missed,startCase);newCase()};
}
home();
try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&!/claude|anthropic/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(function(){})}}catch(e){}
})();
</script>
