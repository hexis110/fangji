<title>方剂学习题本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one reading column, like a study booklet; chapter "drawers" on the home page, one question card per screen */
:root{
  --paper:#f3f4ef;      /* rice-paper ground, faint green bias */
  --sheet:#fbfcf8;      /* card surface */
  --ink:#1f2a24;        /* ink, green-black */
  --muted:#5f6b63;
  --rule:#d9ddd3;
  --dai:#2f5d62;        /* 黛青 primary */
  --dai-soft:#e3ecea;
  --zhu:#b5402f;        /* 朱 cinnabar: wrong / marks */
  --zhu-soft:#f6e3df;
  --ai:#3f7a4a;         /* 艾绿 correct */
  --ai-soft:#e2efe2;
  --amber:#93650f;      /* disputed */
  --amber-soft:#f5ecd8;
  --serif:"Songti SC","STSong","Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#131815;--sheet:#1b221e;--ink:#e4e9e3;--muted:#9aa69e;--rule:#2f3a33;
  --dai:#7fb6b9;--dai-soft:#213334;--zhu:#ec8a77;--zhu-soft:#3a2420;--ai:#8cc694;--ai-soft:#1f3323;--amber:#e0b660;--amber-soft:#352c19;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131815;--sheet:#1b221e;--ink:#e4e9e3;--muted:#9aa69e;--rule:#2f3a33;
  --dai:#7fb6b9;--dai-soft:#213334;--zhu:#ec8a77;--zhu-soft:#3a2420;--ai:#8cc694;--ai-soft:#1f3323;--amber:#e0b660;--amber-soft:#352c19;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);font-size:16px;line-height:1.6;margin:0;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--dai);outline-offset:2px}
h1,h2{font-family:var(--serif);font-weight:700;text-wrap:balance;margin:0}
.label{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- home ---------- */
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.masthead h1{font-size:30px;letter-spacing:.06em}
.masthead .sub{color:var(--muted);font-size:13px}
.seal{font-family:var(--serif);color:var(--zhu);border:2px solid var(--zhu);border-radius:4px;padding:2px 6px;font-size:13px;letter-spacing:.1em;transform:rotate(-4deg)}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin-top:18px}
.summary div{background:var(--sheet);padding:12px 14px}
.summary b{display:block;font-family:var(--serif);font-size:24px;line-height:1.2}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:12px 10px;text-align:center;line-height:1.3}
.btn small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.btn.primary{background:var(--dai);border-color:var(--dai);color:var(--sheet)}
.btn.primary small{color:var(--sheet);opacity:.85}
.btn:disabled{opacity:.45;cursor:default}
.toggles{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--muted)}
.toggles label{display:flex;align-items:center;gap:6px}
.toggles input{accent-color:var(--dai);width:18px;height:18px}
.sectionhead{display:flex;justify-content:space-between;align-items:baseline;margin-top:30px;margin-bottom:10px}
.sectionhead h2{font-size:19px}
.cabinet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.cabinet{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}
.drawer{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:12px 14px 12px;position:relative}
.drawer::after{content:"";position:absolute;top:10px;right:12px;width:18px;height:6px;border:1px solid var(--muted);border-radius:4px;opacity:.5}
.drawer .name{font-family:var(--serif);font-size:18px;font-weight:700;padding-right:26px}
.drawer .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.bar{height:5px;background:var(--rule);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .r{background:var(--ai)}.bar .w{background:var(--zhu)}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:16px;margin-top:10px}
.panel p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}
textarea{width:100%;min-height:90px;font:13px/1.4 ui-monospace,Menlo,monospace;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:8px;margin-top:10px;word-break:break-all}
.msg{font-size:14px;margin-top:8px;color:var(--dai)}
.foot{margin-top:28px;font-size:12px;color:var(--muted);line-height:1.7}

/* ---------- quiz ---------- */
.qtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--rule)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.back{border:0;background:none;padding:6px 8px 6px 0;color:var(--dai);font-size:15px}
.qtop .title{flex:1;min-width:0;font-family:var(--serif);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qtop .count{font-size:13px;color:var(--muted)}
.progress{height:3px;background:var(--rule);margin-top:-1px}
.progress i{display:block;height:100%;background:var(--dai);transition:width .2s}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:18px 16px 16px;margin-top:16px}
.tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.tag{border:1px solid var(--rule);border-radius:3px;padding:1px 6px}
.tag.b{border-color:var(--dai);color:var(--dai)}
.tag.wb{border-color:var(--zhu);color:var(--zhu)}
.stem{font-family:var(--serif);font-size:19px;line-height:1.65;margin:12px 0 14px;min-width:0;overflow-wrap:anywhere}
.groupnote{font-size:13px;color:var(--muted);margin:-6px 0 10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:5px;padding:11px 12px;min-height:48px;overflow-wrap:anywhere}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--muted);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted)}
.opt .t{flex:1;min-width:0;padding-top:1px}
.opt.correct{background:var(--ai-soft);border-color:var(--ai)}
.opt.correct .k{background:var(--ai);border-color:var(--ai);color:var(--sheet)}
.opt.wrong{background:var(--zhu-soft);border-color:var(--zhu)}
.opt.wrong .k{background:var(--zhu);border-color:var(--zhu);color:var(--sheet)}
.opt:disabled{cursor:default;color:var(--ink)}
.explain{margin-top:14px;padding:12px 14px;border-left:3px solid var(--ai);background:var(--ai-soft);border-radius:0 4px 4px 0;font-size:15px}
.explain.bad{border-left-color:var(--zhu);background:var(--zhu-soft)}
.explain b{font-family:var(--serif)}
.note{margin-top:8px;font-size:13px;color:var(--amber);background:var(--amber-soft);border-radius:4px;padding:8px 10px}
.qfoot{display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap}
.qfoot .btn{flex:1 1 120px}
.dispute{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.dispute.on{color:var(--amber)}
.result{text-align:center;padding:28px 16px}
.result .score{font-family:var(--serif);font-size:56px;line-height:1;margin:10px 0}
.wronglist{text-align:left;margin-top:18px;display:flex;flex-direction:column;gap:8px}
.wronglist div{font-size:14px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:8px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function chStats(ci){
  var t=0,r=0,w=0,seen=0;
  for(var i=0;i<Q.length;i++){if(Q[i][1]!==ci)continue;t++;var x=P[Q[i][0]];if(x&&x[0]){seen++;if(x[2]===1)r++;else w++}}
  return{t:t,r:r,w:w,seen:seen};
}
function wrongIds(){var a=[];for(var i=0;i<Q.length;i++){var x=P[Q[i][0]];if(x&&x[3])a.push(i)}return a}
function disputedCount(){var n=0;for(var k in P)if(P[k][5])n++;return n}

// ---------- home ----------
function home(msg){
  var seen=0,right=0;
  for(var k in P){if(P[k][0]){seen++;if(P[k][2]===1)right++}}
  var wb=wrongIds().length;
  var acc=seen?Math.round(right/seen*100)+'%':'—';
  var last=S.last!=null&&CH[S.last]?S.last:null;
  var h='';
  h+='<header class="masthead"><div><div class="label">新加坡中医学院 · 十四五版</div><h1>方剂学习题本</h1><div class="sub">'+Q.length+' 道练习题 · 附答案与解析 · 可离线使用</div></div><span class="seal">温故知新</span></header>';
  h+='<div class="summary tnum"><div><span class="label">已做</span><b>'+seen+'</b><span class="label">/ '+Q.length+'</span></div><div><span class="label">正确率</span><b>'+acc+'</b></div><div><span class="label">错题本</span><b style="color:var(--zhu)">'+wb+'</b></div></div>';
  h+='<div class="actions">';
  h+='<button class="btn primary" id="b-cont">'+(last!=null?'继续练习<small>'+esc(CH[last])+'</small>':'开始练习<small>'+esc(CH[0])+'</small>')+'</button>';
  h+='<button class="btn" id="b-wrong"'+(wb?'':' disabled')+'>错题重练<small>'+(wb?wb+' 题 · 连对两次移出':'暂无错题')+'</small></button>';
  h+='<button class="btn" id="b-rand">随机 20 题<small>全书混合</small></button>';
  h+='</div>';
  h+='<div class="toggles"><label><input type="checkbox" id="t-shuffle"'+(S.shuffle?' checked':'')+'>题目乱序</label><label><input type="checkbox" id="t-unseen"'+(S.unseen?' checked':'')+'>只做没做过的题</label></div>';
  h+='<div class="sectionhead"><h2>按章节练习</h2><span class="label">绿＝最近答对　红＝最近答错</span></div><div class="cabinet">';
  for(var c=0;c<CH.length;c++){
    var s=chStats(c);
    h+='<button class="drawer" data-ch="'+c+'"><span class="name">'+esc(CH[c])+'</span><span class="bar"><i class="r" style="width:'+(s.r/s.t*100)+'%"></i><i class="w" style="width:'+(s.w/s.t*100)+'%"></i></span><span class="meta tnum"><span>'+s.seen+' / '+s.t+' 题</span><span>'+(s.seen?Math.round(s.r/s.seen*100)+'% 正确':'未开始')+'</span></span></button>';
  }
  h+='</div>';
  h+='<div class="sectionhead"><h2>换设备与备份</h2><span class="label">进度只存在本机</span></div>';
  h+='<div class="panel"><p>进度保存在这台设备上。要转到手机或 iPad，点“复制进度码”，用 WhatsApp 或微信发给自己，在另一台设备上粘贴后点“导入”。导入会合并两边的记录。</p>';
  h+='<div class="row"><button class="btn" id="b-export">复制进度码</button><button class="btn" id="b-import">导入</button><button class="btn" id="b-file">从文件导入</button></div>';
  h+='<input type="file" id="f-import" accept=".txt,.json,text/plain" hidden>';
  h+='<textarea id="code" placeholder="在这里粘贴进度码，然后点“导入”"></textarea>';
  h+='<div class="msg" id="msg">'+(msg||'')+'</div>';
  h+='<div class="row" style="margin-top:10px"><button class="btn" id="b-reset">清空全部进度</button></div><div id="confirm"></div></div>';
  var dc=disputedCount();
  h+='<p class="foot">答案与解析依据课堂讲义与通行教材整理，个别题目各版教材说法不一，已标“存疑”。做题时如认为答案有误，可点“我觉得答案不对”，已标记 <b class="tnum">'+dc+'</b> 题，方便日后向老师确认。部分方剂十四五版教材未分君臣佐使，相关题目依旧版教材作答，题中已注明。</p>';
  app.innerHTML=h;
  bindHome();
}
function bindHome(){
  document.getElementById('b-cont').onclick=function(){start('ch',S.last!=null?S.last:0)};
  document.getElementById('b-wrong').onclick=function(){start('wrong')};
  document.getElementById('b-rand').onclick=function(){start('rand')};
  document.getElementById('t-shuffle').onchange=function(e){S.shuffle=e.target.checked;save(SKEY,S)};
  document.getElementById('t-unseen').onchange=function(e){S.unseen=e.target.checked;save(SKEY,S)};
  Array.prototype.forEach.call(document.querySelectorAll('.drawer'),function(b){b.onclick=function(){start('ch',+b.getAttribute('data-ch'))}});
  var code=document.getElementById('code'),msg=document.getElementById('msg');
  document.getElementById('b-export').onclick=function(){
    var s=exportCode(); code.value=s;
    var ok=function(){msg.textContent='进度码已复制（'+Object.keys(P).length+' 题记录）。发给自己，在另一台设备粘贴导入。'};
    try{navigator.clipboard.writeText(s).then(ok,function(){code.select();msg.textContent='请长按上面的文字，选“全选”再“复制”。'})}catch(e){code.select();msg.textContent='请长按上面的文字，选“全选”再“复制”。'}
  };
  document.getElementById('b-import').onclick=function(){importCode(code.value)};
  var fi=document.getElementById('f-import');
  document.getElementById('b-file').onclick=function(){fi.click()};
  fi.onchange=function(){var f=fi.files[0];if(!f)return;var r=new FileReader();r.onload=function(){importCode(String(r.result))};r.readAsText(f)};
  document.getElementById('b-reset').onclick=function(){
    var c=document.getElementById('confirm');
    c.innerHTML='<p style="color:var(--zhu);margin:10px 0 6px">确定清空这台设备上的全部进度吗？此操作无法撤销。</p><div class="row"><button class="btn" id="b-yes" style="border-color:var(--zhu);color:var(--zhu)">确定清空</button><button class="btn" id="b-no">取消</button></div>';
    document.getElementById('b-yes').onclick=function(){P={};save(KEY,P);home('进度已清空。')};
    document.getElementById('b-no').onclick=function(){c.innerHTML=''};
  };
}
function exportCode(){
  var s=JSON.stringify({v:1,p:P});
  return 'FJ1:'+btoa(unescape(encodeURIComponent(s)));
}
function importCode(txt){
  var msg=document.getElementById('msg');
  try{
    txt=String(txt).trim(); var m=txt.indexOf('FJ1:'); if(m<0)throw 0;
    var o=JSON.parse(decodeURIComponent(escape(atob(txt.slice(m+4).replace(/\s+/g,'')))));
    var n=0;
    for(var id in o.p){var a=o.p[id],b=P[id];
      if(!b||a[0]>b[0]){P[id]=a.slice();if(b&&b[5])P[id][5]=1;n++}
      else if(a[5]&&!b[5]){b[5]=1}
    }
    save(KEY,P); home('已导入，更新了 '+n+' 题记录。');
  }catch(e){msg.textContent='无法识别这段进度码。请确认复制完整（以 FJ1: 开头）。'}
}

// ---------- quiz ----------
var run=null;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function start(mode,ch){
  var list=[],title='';
  if(mode==='ch'){
    title=CH[ch];S.last=ch;save(SKEY,S);
    for(var i=0;i<Q.length;i++)if(Q[i][1]===ch&&(!S.unseen||!rec(Q[i][0])[0]))list.push(i);
    if(S.shuffle)list=shuffleKeepGroups(list);
    if(!list.length){home('“'+CH[ch]+'”的题都做过了。取消勾选“只做没做过的题”即可重做。');return}
  }else if(mode==='wrong'){title='错题重练';list=shuffle(wrongIds())}
  else{title='随机 20 题';var pool=[];for(var i2=0;i2<Q.length;i2++)if(!S.unseen||!rec(Q[i2][0])[0])pool.push(i2);list=shuffle(pool).slice(0,20)}
  run={mode:mode,title:title,list:list,pos:0,answers:{}};
  show();
}
// keep B-type groups together when shuffling a chapter
function shuffleKeepGroups(list){
  var blocks=[],cur=null;
  list.forEach(function(i){var g=Q[i][9];if(g&&cur&&cur.g===g){cur.items.push(i)}else{cur={g:g,items:[i]};blocks.push(cur)}});
  return [].concat.apply([],shuffle(blocks).map(function(b){return b.items}));
}
function show(){
  window.scrollTo(0,0);
  if(run.pos>=run.list.length)return finish();
  var qi=run.list[run.pos],q=Q[qi],r=rec(q[0]),ans=run.answers[run.pos];
  var h='<div class="qtop"><button class="back" id="b-home">‹ 目录</button><span class="title">'+esc(run.title)+'</span><span class="count tnum">'+(run.pos+1)+' / '+run.list.length+'</span></div>';
  h+='<div class="progress"><i style="width:'+((run.pos)/run.list.length*100)+'%"></i></div>';
  h+='<article class="card"><div class="tags"><span class="tag'+(q[2]?' b':'')+'">'+(q[2]?'B型题':'A型题')+'</span><span>'+esc(CH[q[1]])+'</span>'+(r[3]?'<span class="tag wb">错题本</span>':'')+(r[0]?'<span class="tnum">做过 '+r[0]+' 次</span>':'')+'</div>';
  h+='<div class="stem">'+esc(q[3])+'</div>';
  if(q[2])h+='<div class="groupnote">B型题：以下备选答案为一组题共用，可重复选用。</div>';
  h+='<div class="opts">';
  for(var i=0;i<q[4].length;i++){
    var cls='';
    if(ans!=null){if(i===q[5])cls=' correct';else if(i===ans)cls=' wrong'}
    h+='<button class="opt'+cls+'" data-i="'+i+'"'+(ans!=null?' disabled':'')+'><span class="k">'+LET[i]+'</span><span class="t">'+esc(q[4][i])+'</span></button>';
  }
  h+='</div>';
  if(ans!=null){
    var ok=ans===q[5];
    h+='<div class="explain'+(ok?'':' bad')+'"><b>'+(ok?'答对了。':'答案是 '+LET[q[5]]+'。')+'</b> '+esc(q[6])+'</div>';
    if(q[7])h+='<div class="note">此题答案存疑：各版教材说法不一，建议向老师确认。</div>';
    if(q[8])h+='<div class="note">'+esc(q[8])+'</div>';
    h+='<div class="qfoot"><button class="dispute'+(r[5]?' on':'')+'" id="b-disp">'+(r[5]?'已标记：答案可能有误（点此取消）':'我觉得答案不对')+'</button></div>';
  }
  h+='</article>';
  h+='<div class="qfoot"><button class="btn" id="b-prev"'+(run.pos?'':' disabled')+'>上一题</button><button class="btn primary" id="b-next">'+(ans!=null?(run.pos+1<run.list.length?'下一题':'看结果'):'跳过')+'</button></div>';
  app.innerHTML=h;
  document.getElementById('b-home').onclick=function(){run=null;home()};
  document.getElementById('b-prev').onclick=function(){run.pos--;show()};
  document.getElementById('b-next').onclick=function(){run.pos++;show()};
  var bd=document.getElementById('b-disp');
  if(bd)bd.onclick=function(){var x=rec(q[0]).slice();x[5]=x[5]?0:1;setRec(q[0],x);show()};
  Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b){b.onclick=function(){answer(+b.getAttribute('data-i'))}});
}
function answer(i){
  var q=Q[run.list[run.pos]],ok=i===q[5],x=rec(q[0]).slice();
  run.answers[run.pos]=i;
  x[0]++; if(ok)x[1]++; x[2]=ok?1:2;
  if(ok){ if(x[3]){x[4]++; if(x[4]>=2){x[3]=0;x[4]=0}} }
  else {x[3]=1;x[4]=0}
  setRec(q[0],x); show();
}
function finish(){
  var n=0,c=0,wrong=[];
  for(var p=0;p<run.list.length;p++){var a=run.answers[p];if(a==null)continue;n++;var q=Q[run.list[p]];if(a===q[5])c++;else wrong.push(q)}
  var h='<div class="qtop"><button class="back" id="b-home">‹ 目录</button><span class="title">'+esc(run.title)+'</span></div>';
  h+='<div class="card result"><div class="label">本轮成绩</div><div class="score tnum">'+c+' / '+n+'</div><div style="color:var(--muted)">'+(n?Math.round(c/n*100)+'% 正确':'没有作答')+(run.list.length>n?' · 跳过 '+(run.list.length-n)+' 题':'')+'</div>';
  if(wrong.length){h+='<div class="wronglist">';wrong.forEach(function(q){h+='<div><b>'+LET[q[5]]+'</b>　'+esc(q[3])+'</div>'});h+='</div>'}
  h+='<div class="qfoot"><button class="btn" id="b-again">再做一遍</button>'+(wrong.length?'<button class="btn primary" id="b-redo">只重做错题（'+wrong.length+'）</button>':'')+'</div></div>';
  app.innerHTML=h;
  document.getElementById('b-home').onclick=function(){run=null;home()};
  document.getElementById('b-again').onclick=function(){run.pos=0;run.answers={};show()};
  var rd=document.getElementById('b-redo');
  if(rd)rd.onclick=function(){var l=[];for(var p=0;p<run.list.length;p++){var a=run.answers[p];if(a!=null&&a!==Q[run.list[p]][5])l.push(run.list[p])}run={mode:'redo',title:'重做错题',list:l,pos:0,answers:{}};show()};
}
home();
try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&!/claude|anthropic/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(function(){})}}catch(e){}
})();
</script>

</body></html>
